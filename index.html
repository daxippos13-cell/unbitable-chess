<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unbeatable AI Chess</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            /* Prevents pull-to-refresh on some mobile browsers */
            overscroll-behavior: none;
        }
        h1 { 
            margin-top: 10px;
            margin-bottom: 20px; 
            text-align: center;
            font-size: clamp(24px, 5vw, 36px); 
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }
        
        .board-container, .sidebar {
            width: 100%;
            max-width: 450px;
        }

        /* FIX: Prevents the screen from moving/scrolling when dragging pieces */
        #myBoard {
            touch-action: none; 
            -webkit-user-select: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        select, button {
            flex: 1; 
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        select { background: #fff; color: #000; }
        button { background: #4CAF50; color: white; font-weight: bold; }
        button:hover { background: #45a049; }
        
        #status {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            border-left: 5px solid #4CAF50;
        }
        
        .ledger-container {
            background: #1e1e1e;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            height: 300px; 
        }
        .ledger-header {
            background: #333;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        #ledger {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
            font-size: 16px;
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            row-gap: 5px;
        }
        .move-num { color: #888; }
        .move-white { color: #fff; }
        .move-black { color: #aaa; }

        /* Promotion Modal */
        #promotion-modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.85);
            justify-content: center; 
            align-items: center;
        }
        .modal-content {
            background-color: #333; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center;
            border: 2px solid #4CAF50;
        }
        .promo-pieces {
            display: flex; 
            gap: 10px; 
            margin-top: 15px;
        }
        .promo-piece {
            width: 65px; height: 65px; 
            background: #555; 
            border-radius: 8px; 
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .promo-piece img { width: 55px; height: 55px; }
    </style>
</head>
<body>

    <h1>Unbeatable AI Chess</h1>

    <div class="container">
        <div class="board-container">
            <div class="controls">
                <select id="player-color">
                    <option value="w">Play as White</option>
                    <option value="b">Play as Black</option>
                </select>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="myBoard"></div>
        </div>

        <div class="sidebar">
            <div id="status">Press Start to Begin</div>
            <div class="ledger-container">
                <div class="ledger-header">Move History</div>
                <div id="ledger"></div>
            </div>
        </div>
    </div>

    <div id="promotion-modal">
        <div class="modal-content">
            <h3>Promote Pawn</h3>
            <div class="promo-pieces">
                <div class="promo-piece" onclick="promotePiece('q')"><img id="promo-q" src=""></div>
                <div class="promo-piece" onclick="promotePiece('r')"><img id="promo-r" src=""></div>
                <div class="promo-piece" onclick="promotePiece('b')"><img id="promo-b" src=""></div>
                <div class="promo-piece" onclick="promotePiece('n')"><img id="promo-n" src=""></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let engine = null;
        let playerColor = 'w';
        let aiThinking = false;
        let pendingPromotionMove = null;

        const statusEl = $('#status');
        const ledgerEl = document.getElementById('ledger');

        // 1. Load Stockfish Engine
        fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
            .then(res => res.text())
            .then(text => {
                const blob = new Blob([text], {type: 'application/javascript'});
                engine = new Worker(URL.createObjectURL(blob));
                
                engine.onmessage = function(e) {
                    if (e.data.includes('bestmove')) {
                        const match = e.data.match(/^bestmove ([a-h][1-8])([a-h][1-8])([qrbn])?/);
                        if (match) {
                            game.move({ from: match[1], to: match[2], promotion: match[3] || 'q' });
                            board.position(game.fen());
                            aiThinking = false;
                            updateStatus();
                        }
                    }
                };

                engine.postMessage('uci');
                engine.postMessage('setoption name Skill Level value 20');
                // SPEED OPTIMIZATION: Use 32MB of Hash memory
                engine.postMessage('setoption name Hash value 32'); 
            });

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                status = `Checkmate! ${moveColor} loses.`;
            } else if (game.in_draw()) {
                status = 'Game Over: Draw';
            } else {
                status = `${moveColor}'s turn`;
                if (game.in_check()) status += ' (Check!)';
            }

            statusEl.html(status);
            updateLedger();

            // Trigger AI if it's not the player's turn
            if (!game.game_over() && game.turn() !== playerColor && !aiThinking) {
                aiThinking = true;
                statusEl.html('AI is thinking...');
                engine.postMessage(`position fen ${game.fen()}`);
                // SPEED OPTIMIZATION: Think for exactly 1 second (1000ms)
                engine.postMessage('go movetime 1000'); 
            }
        }

        function updateLedger() {
            const history = game.history();
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                html += `<div class="move-num">${(i/2)+1}.</div>
                         <div class="move-white">${history[i]}</div>
                         <div class="move-black">${history[i+1] || ''}</div>`;
            }
            ledgerEl.innerHTML = html;
            ledgerEl.scrollTop = ledgerEl.scrollHeight;
        }

        function onDragStart(source, piece) {
            if (game.game_over() || aiThinking) return false;
            if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                (playerColor === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onDrop(source, target) {
            let moves = game.moves({ verbose: true });
            let move = moves.find(m => m.from === source && m.to === target);

            if (!move) return 'snapback';

            if (move.flags.includes('p')) {
                pendingPromotionMove = { source, target };
                const c = game.turn();
                const baseUrl = 'https://chessboardjs.com/img/chesspieces/wikipedia/';
                document.getElementById('promo-q').src = `${baseUrl}${c}Q.png`;
                document.getElementById('promo-r').src = `${baseUrl}${c}R.png`;
                document.getElementById('promo-b').src = `${baseUrl}${c}B.png`;
                document.getElementById('promo-n').src = `${baseUrl}${c}N.png`;
                document.getElementById('promotion-modal').style.display = 'flex';
                return;
            }

            game.move({ from: source, to: target });
            updateStatus();
        }

        function promotePiece(type) {
            document.getElementById('promotion-modal').style.display = 'none';
            game.move({ from: pendingPromotionMove.source, to: pendingPromotionMove.target, promotion: type });
            pendingPromotionMove = null;
            board.position(game.fen());
            updateStatus();
        }

        function onSnapEnd() {
            if (!pendingPromotionMove) board.position(game.fen());
        }

        board = Chessboard('myBoard', {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        });

        $(window).resize(board.resize);

        $('#start-btn').on('click', function() {
            if(!engine) return alert("AI still loading...");
            game.reset();
            playerColor = $('#player-color').val();
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.position('start');
            aiThinking = false;
            updateStatus();
        });
    </script>
</body>
</html>
