<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable AI Chess</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }
        h1 { 
            margin-top: 10px;
            margin-bottom: 20px; 
            text-align: center;
            font-size: clamp(24px, 5vw, 36px); 
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }
        
        .board-container, .sidebar {
            width: 100%;
            max-width: 450px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        select, button {
            flex: 1; 
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        select { background: #fff; color: #000; }
        button { background: #4CAF50; color: white; font-weight: bold; }
        button:hover { background: #45a049; }
        
        #status {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            border-left: 5px solid #4CAF50;
        }
        
        .ledger-container {
            background: #1e1e1e;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            height: 350px; 
        }
        .ledger-header {
            background: #333;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        #ledger {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
            font-size: 16px;
            display: grid;
            grid-template-columns: 30px 1fr 1fr;
            row-gap: 5px;
        }
        .move-num { color: #888; }
        .move-white { color: #fff; }
        .move-black { color: #aaa; }

        /* Custom Promotion Modal Menu */
        #promotion-modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.85);
            justify-content: center; 
            align-items: center;
        }
        .modal-content {
            background-color: #333; 
            padding: 20px 30px; 
            border-radius: 10px; 
            text-align: center;
            border: 2px solid #4CAF50;
        }
        .promo-pieces {
            display: flex; 
            gap: 15px; 
            margin-top: 15px; 
            justify-content: center;
        }
        .promo-piece {
            width: 70px; 
            height: 70px; 
            background: #555; 
            border-radius: 10px; 
            cursor: pointer;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: 0.2s;
        }
        .promo-piece:hover { 
            background: #4CAF50; 
            transform: scale(1.1); 
        }
        .promo-piece img { 
            width: 60px; 
            height: 60px; 
        }
    </style>
</head>
<body>

    <h1>Unbeatable AI Chess</h1>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-container">
            <div class="controls">
                <select id="player-color">
                    <option value="w">Play as White</option>
                    <option value="b">Play as Black</option>
                </select>
                <button id="start-btn">Start Game</button>
            </div>
            <!-- The Board -->
            <div id="myBoard" style="width: 100%"></div>
        </div>

        <!-- Sidebar / Ledger Area -->
        <div class="sidebar">
            <div id="status">Waiting to start...</div>
            <div class="ledger-container">
                <div class="ledger-header">Move History</div>
                <div id="ledger"></div>
            </div>
        </div>
    </div>

    <!-- The Promotion Pop-up Modal -->
    <div id="promotion-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Promote Pawn</h3>
            <div class="promo-pieces">
                <div class="promo-piece" onclick="promotePiece('q')"><img id="promo-q" src=""></div>
                <div class="promo-piece" onclick="promotePiece('r')"><img id="promo-r" src=""></div>
                <div class="promo-piece" onclick="promotePiece('b')"><img id="promo-b" src=""></div>
                <div class="promo-piece" onclick="promotePiece('n')"><img id="promo-n" src=""></div>
            </div>
        </div>
    </div>

    <!-- Chessboard.js & Chess.js Libraries -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let engine = null;
        let playerColor = 'w';
        let aiThinking = false;
        let pendingPromotionMove = null;

        const statusEl = $('#status');
        const ledgerEl = document.getElementById('ledger');

        // --- 1. INITIALIZE UNBEATABLE AI (STOCKFISH) ---
        fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
            .then(response => response.text())
            .then(text => {
                const blob = new Blob([text], {type: 'application/javascript'});
                engine = new Worker(URL.createObjectURL(blob));
                
                engine.onmessage = function(event) {
                    const line = event.data;
                    
                    if (line.includes('bestmove')) {
                        const match = line.match(/^bestmove ([a-h][1-8])([a-h][1-8])([qrbn])?/);
                        if (match) {
                            const move = {
                                from: match[1],
                                to: match[2],
                                promotion: match[3] || 'q'
                            };
                            
                            game.move(move);
                            board.position(game.fen());
                            aiThinking = false;
                            updateStatus();
                        }
                    }
                };

                engine.postMessage('uci');
                engine.postMessage('setoption name Skill Level value 20');
                engine.postMessage('setoption name Contempt value 100');
            });

        // --- 2. GAME LOGIC & UI ---
        function updateStatus() {
            let statusHTML = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusHTML = `Game over, ${moveColor} is in checkmate.`;
            } else if (game.in_draw()) {
                statusHTML = 'Game over, drawn position';
                if(game.in_threefold_repetition()) statusHTML += " (Repetition)";
                if(game.insufficient_material()) statusHTML += " (Insufficient Material)";
                if(game.in_stalemate()) statusHTML += " (Stalemate)";
            } else {
                statusHTML = `${moveColor}'s turn`;
                if (game.in_check()) {
                    statusHTML += ' <span style="color:red">(Check)</span>';
                }
            }

            statusEl.html(statusHTML);
            updateLedger();

            if (!game.game_over() && game.turn() !== playerColor && !aiThinking) {
                aiThinking = true;
                statusEl.html('AI is thinking...');
                engine.postMessage(`position fen ${game.fen()}`);
                engine.postMessage('go depth 18'); 
            }
        }

        function updateLedger() {
            const history = game.history();
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                let moveNum = (i / 2) + 1;
                let whiteMove = history[i];
                let blackMove = history[i + 1] ? history[i + 1] : '';
                html += `<div class="move-num">${moveNum}.</div>
                         <div class="move-white">${whiteMove}</div>
                         <div class="move-black">${blackMove}</div>`;
            }
            ledgerEl.innerHTML = html;
            ledgerEl.scrollTop = ledgerEl.scrollHeight; 
        }

        // --- 3. BOARD INTERACTION & PROMOTION LOGIC ---
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                (playerColor === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
            if (game.turn() !== playerColor || aiThinking || pendingPromotionMove) return false;
        }

        function onDrop(source, target) {
            // Get a list of all legal moves to check if this specific move is valid
            let moves = game.moves({ verbose: true });
            let isLegal = false;
            let isPromote = false;
            
            for (let i = 0; i < moves.length; i++) {
                if (moves[i].from === source && moves[i].to === target) {
                    isLegal = true;
                    // Check if the move is a promotion move
                    if (moves[i].flags.includes('p') || moves[i].promotion) {
                        isPromote = true;
                    }
                    break;
                }
            }

            // If illegal, snap back
            if (!isLegal) return 'snapback';

            // If it is a promotion, open the menu and PAUSE the move
            if (isPromote) {
                pendingPromotionMove = { source: source, target: target };
                let color = game.turn();
                
                // Load the correct piece images (White or Black) into the modal
                document.getElementById('promo-q').src = `https://chessboardjs.com/img/chesspieces/wikipedia/${color}Q.png`;
                document.getElementById('promo-r').src = `https://chessboardjs.com/img/chesspieces/wikipedia/${color}R.png`;
                document.getElementById('promo-b').src = `https://chessboardjs.com/img/chesspieces/wikipedia/${color}B.png`;
                document.getElementById('promo-n').src = `https://chessboardjs.com/img/chesspieces/wikipedia/${color}N.png`;
                
                document.getElementById('promotion-modal').style.display = 'flex';
                
                // Return undefined so the piece visually stays on the target square until they pick
                return;
            }

            // Standard move (Not a promotion)
            game.move({ from: source, to: target });
            updateStatus();
        }

        // Called when the user clicks a piece in the Promotion pop-up
        function promotePiece(pieceType) {
            document.getElementById('promotion-modal').style.display = 'none';
            if (pendingPromotionMove) {
                game.move({
                    from: pendingPromotionMove.source,
                    to: pendingPromotionMove.target,
                    promotion: pieceType
                });
                pendingPromotionMove = null;
                board.position(game.fen());
                updateStatus();
            }
        }

        function onSnapEnd() {
            // Don't update board if waiting for promotion menu choice
            if (pendingPromotionMove) return; 
            board.position(game.fen());
        }

        // --- 4. SETUP ---
        const config = {
            draggable: true,
            position: 'start',
            showNotation: true,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = Chessboard('myBoard', config);
        
        // Responsive resize
        $(window).resize(board.resize);

        $('#start-btn').on('click', function() {
            if(!engine) {
                alert("Please wait 2 seconds for the AI engine to load and try again.");
                return;
            }
            game.reset();
            playerColor = $('#player-color').val();
            board.position('start');
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            aiThinking = false;
            pendingPromotionMove = null;
            document.getElementById('promotion-modal').style.display = 'none';
            updateStatus();
        });

    </script>
</body>
</html>
